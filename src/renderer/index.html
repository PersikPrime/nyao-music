<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; media-src nyao:; connect-src 'none'">
<title>Nyao Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme-mac.css">
</head>
<body>
<!-- Фон для темы macOS: цветные пятна и живая лента под стеклом -->
<div class="backdrop" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <canvas id="bg-ribbon"></canvas>
</div>

<div class="app">
  <header class="titlebar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 10.6c3-5 6-5 9 0s6 5 9 0" stroke="#FFD60A"/><path d="M3 13.4c3-5 6-5 9 0s6 5 9 0" stroke="#F0574A"/><path d="M3 12c3-5 6-5 9 0s6 5 9 0" stroke="#D8CEFF"/></svg>
      <span>Nyao Music</span>
    </div>
    <div class="accounts" id="accounts"></div>
    <div class="winctl">
      <button data-win="minimize" aria-label="Свернуть"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" fill="none"><path d="M1 6h10"/></svg></button>
      <button data-win="maximize" aria-label="Развернуть"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" fill="none"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
      <button data-win="close" class="close" aria-label="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" fill="none"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Разделы"></nav>
    <main id="view" class="view"></main>
    <aside id="drawer" class="drawer" aria-label="Об исполнителе и треке" aria-hidden="true" inert></aside>
  </div>

  <footer class="playerbar" id="playerbar">
    <div class="now">
      <button class="cover-btn" id="pb-coverbtn" aria-label="Полный экран" title="Полный экран"><div id="pb-cover"></div></button>
      <div class="meta">
        <button class="t link-plain" id="pb-title">Ничего не играет</button>
        <div class="s" id="pb-sub">Запусти «Мою волну»</div>
      </div>
    </div>
    <div class="center">
      <div class="controls">
        <button id="pb-radio" class="ic side" aria-label="Волна по треку" title="Волна по треку — похожее на то, что играет"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></svg></button>
        <button id="pb-full" class="ic side" aria-label="Полный экран" title="Полный экран (F11)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <span class="gap side"></span>
        <button id="pb-shuffle" class="ic side" aria-label="Перемешать"></button>
        <button id="pb-prev" class="ic lg" aria-label="Предыдущий"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="pb-play" class="play" aria-label="Играть"></button>
        <button id="pb-next" class="ic lg" aria-label="Следующий"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button id="pb-repeat" class="ic side" aria-label="Повтор"></button>
        <span class="gap side"></span>
        <button id="pb-like" class="ic" aria-label="Мне нравится"></button>
        <button id="pb-add" class="ic" aria-label="Добавить в микс или плейлист" title="Добавить в микс или плейлист"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="progress"><span id="pb-cur">0:00</span><input type="range" id="pb-seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="pb-dur">0:00</span></div>
    </div>
    <div class="right">
      <button id="pb-connect" class="ic wide-only" aria-label="Nyao Connect: другие устройства" title="Устройства и «Слушать вместе»"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="12" height="9" rx="2"/><path d="M6 18h6"/><rect x="17" y="8" width="4.5" height="11" rx="1.4"/></svg></button>
      <button id="pb-panel" class="ic" aria-label="Об исполнителе и треке" title="Об исполнителе и треке" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM15 5v14"/></svg></button>
      <button id="pb-queue" class="ic wide-only" aria-label="Очередь" title="Очередь" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h10M17 15v6l4-3z"/></svg></button>
      <button id="pb-more" class="ic narrow-only" aria-label="Ещё: волна по треку, устройства, очередь" title="Ещё"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
      <span class="vol"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6"/></svg>
      <input type="range" id="pb-vol" min="0" max="100" value="80" aria-label="Громкость"></span>
    </div>
  </footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="menu" class="menu" hidden></div>
<div id="connect" class="connect-pop" role="dialog" aria-label="Nyao Connect" hidden></div>
<div id="react-layer" aria-hidden="true"></div>
<audio id="audio" preload="auto"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
