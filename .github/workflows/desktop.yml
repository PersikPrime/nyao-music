# Сборка десктопной версии: Windows (.exe-установщик) и macOS (.dmg для Apple Silicon и Intel).
# Готовые файлы попадают в тот же релиз, что и APK (тег v0.2.N).
name: Desktop (Windows + macOS)

on:
  push:
    # все ветки, включая nightly: на nightly пробуем Electron от castlabs (Widevine для Spotify)
    branches: ['**']
    paths: ['native/**', 'scripts/build-native.mjs', 'test/**', 'src/**', 'build/**', 'package.json', 'package-lock.json', 'version.json', '.github/workflows/desktop.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis zip --x64
            files: dist/*.exe dist/*.zip
          - os: macos-15-intel
            args: --mac dmg --arm64 --x64
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron и инструменты electron-builder — в кеше между запусками: меньше скачиваний с GitHub Releases
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/librespot
      - name: Сборка нативного Spotify
        run: npm run build:native
      - name: Проверка версии
        shell: bash
        run: |
          node scripts/bump.mjs --sync
          git diff --exit-code -- version.json package.json
      - name: Проверка порядка VMP-подписи
        run: node --test build/evs-sign.test.cjs
      - name: Проверка волны и восстановления сервисов
        run: node --test test/*.test.js
      # Electron от castlabs несёт Widevine; VMP-подпись — через castlabs EVS (учётка в секретах)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Вход в castlabs EVS
        shell: bash
        env:
          EVS_ACCOUNT: ${{ secrets.NYAO_EVS_ACCOUNT }}
          EVS_PASSWD: ${{ secrets.NYAO_EVS_PASSWD }}
        run: |
          python -m pip install --quiet --upgrade castlabs-evs
          if [ -z "$EVS_ACCOUNT" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::error::Нет секретов NYAO_EVS_ACCOUNT / NYAO_EVS_PASSWD — сборка без VMP-подписи, Spotify на ней может не играть"
            exit 1
          fi
          if python -m castlabs_evs.account -n reauth -A "$EVS_ACCOUNT" -P "$EVS_PASSWD"; then
            echo "NYAO_EVS_READY=1" >> "$GITHUB_ENV"
            echo "PYTHON=python" >> "$GITHUB_ENV"
          else
            echo "::error::Вход в castlabs EVS не удался"
            exit 1
          fi
      - name: Ключи Last.fm
        shell: bash
        env:
          LASTFM_KEY: ${{ secrets.NYAO_LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.NYAO_LASTFM_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('src/main/lastfm-keys.json', JSON.stringify({ key: process.env.LASTFM_KEY || '', secret: process.env.LASTFM_SECRET || '' }))"
      # совместимость для быстрых обновлений: пакет кода подходит только установке с тем же Electron и библиотеками
      - name: Совместимость быстрых обновлений
        run: node scripts/hot-bundle.mjs --compat
      # канал nightly — Nyao Music Red: красные волны на иконке. После --compat: иконки на совместимость не влияют.
      # productName не меняем — от него зависит папка с настройками и входами (userData)
      - name: Иконка Nyao Music Red
        shell: bash
        run: |
          if [ "$(node -p "require('./version.json').channel || ''")" = "nightly" ]; then
            cp build/red/icon.png build/icon.png
            cp build/red/icon-mac.png build/icon-mac.png
          fi
      - name: "Сборка Windows: EXE → VMP → NSIS/ZIP"
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        # Electron (сборка castLabs) качается с GitHub Releases, а там бывают 504 — повторяем; удачная загрузка остаётся в кеше
        run: |
          for i in 1 2 3; do
            npm run dist && exit 0
            echo "::warning::сборка не удалась (попытка $i), повторяю"
            sleep $((i*90))
          done
          exit 1
      - name: Сборка macOS
        if: runner.os == 'macOS'
        env:
          # Подписи разработчика нет — сборка неподписанная (на Mac — ad-hoc подпись)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for i in 1 2 3; do
            npx electron-builder ${{ matrix.args }} --publish never && exit 0
            echo "::warning::сборка не удалась (попытка $i), повторяю"
            sleep $((i*90))
          done
          exit 1
      - name: Проверка финальных VMP-подписей macOS
        if: runner.os == 'macOS'
        run: |
          python build/verify-mac.py dist/mac dist/mac-arm64
          python -m castlabs_evs.vmp -n verify-pkg dist/mac dist/mac-arm64
      - name: Артефакты проверочной сборки
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/nightly'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
      - name: Релиз
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-upload.sh ${{ matrix.files }}

  # Быстрое обновление: код приложения (~1 МБ) отдельным подписанным пакетом — ставится без установщика
  hot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Проверка
        run: npm test
      - name: Ключи Last.fm
        shell: bash
        env:
          LASTFM_KEY: ${{ secrets.NYAO_LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.NYAO_LASTFM_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('src/main/lastfm-keys.json', JSON.stringify({ key: process.env.LASTFM_KEY || '', secret: process.env.LASTFM_SECRET || '' }))"
      - name: Пакет кода
        env:
          NYAO_HOT_KEY: ${{ secrets.NYAO_HOT_KEY }}
        run: node scripts/hot-bundle.mjs
      - name: Релиз
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.nui dist/*.nui.sig)
          if [ ${#files[@]} -eq 0 ]; then echo "Пакета нет — пропускаю"; exit 0; fi
          .github/scripts/release-upload.sh "${files[@]}"
