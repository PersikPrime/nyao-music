# Nyao Legacy (Android 4.1–4.4): сборка APK. Готовый файл — Actions → запуск → Artifacts.
name: Legacy APK

on:
  push:
    paths: ['legacy/**', '.github/workflows/legacy.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # Новые корни Let's Encrypt (поколение Y, 2025): ими подписаны сертификаты наших доменов (YE2 и т. п.).
      # Берутся с сайта Let's Encrypt и проверяются: самоподписанный корень с нужным именем.
      - name: Корни Let's Encrypt поколения Y
        run: |
          set -e
          cd legacy/app/src/main/assets/roots
          for k in ye yr; do
            curl -fsSL "https://letsencrypt.org/certs/gen-y/root-$k.pem" -o "isrg-root-$k.pem"
            K=$(echo $k | tr a-z A-Z)
            openssl x509 -in "isrg-root-$k.pem" -noout -subject | grep -q "CN *= *ISRG Root $K" || { echo "::error::root-$k.pem: не тот сертификат"; exit 1; }
            openssl verify -CAfile "isrg-root-$k.pem" "isrg-root-$k.pem" > /dev/null || { echo "::error::root-$k.pem не самоподписанный"; exit 1; }
          done
          for f in *.pem; do echo "$f: $(openssl x509 -in "$f" -noout -subject -fingerprint -sha256 | tr '\n' ' ')"; done
      - name: Сборка
        working-directory: legacy
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v5
        with:
          name: NyaoLegacy-probe
          path: legacy/app/build/outputs/apk/debug/app-debug.apk
