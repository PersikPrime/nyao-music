# Диагностика сервера: достаёт ли он до Telegram и до ретранслятора. Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          import tls from 'node:tls';
          const url = (process.env.TG_RELAY || 'https://oauth.telegram.org').replace(/\/$/, '') + '/.well-known/jwks.json';
          console.log(`::notice::node ${process.version}, OpenSSL ${process.versions.openssl}, кривые по умолчанию: ${tls.DEFAULT_ECDH_CURVE}`);
          const go = async (label) => {
            const t = Date.now();
            try { const r = await fetch(url, { signal: AbortSignal.timeout(8000) }); console.log(`::notice::${label}: HTTP ${r.status} за ${Date.now() - t} мс`); }
            catch (e) { console.log(`::error::${label}: ${e.cause?.code || e.message}`); }
          };
          await go('как есть');
          tls.DEFAULT_ECDH_CURVE = 'X25519:prime256v1:secp384r1';
          await go('без постквантового обмена (X25519/P-256)');
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 3h api 2>&1 | grep -iE 'auth|telegram' | tail -15" | sed 's/^/::warning::log /' || true
