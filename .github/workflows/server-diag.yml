# Диагностика сервера: достаёт ли он до Telegram и до ретранслятора. Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          import fs from 'node:fs';
          for (const d of ['/data/banners', '/data/imgcache']) {
            try { fs.accessSync(d, fs.constants.W_OK); console.log(`::notice::${d}: пишется`); } catch (e) { console.log(`::error::${d}: ${e.code}`); }
          }
          for (const u of ['https://t.me/i/userpic/320/durov.jpg', 'https://i.ytimg.com/vi/dQw4w9WgXcQ/mqdefault.jpg']) {
            const t = Date.now();
            try {
              const r = await fetch('http://127.0.0.1:8080/img?u=' + encodeURIComponent(u), { signal: AbortSignal.timeout(25000) });
              console.log(`::notice::/img ${new URL(u).hostname}: HTTP ${r.status} ${r.headers.get('content-type')} за ${Date.now() - t} мс`);
            } catch (e) { console.log(`::error::/img ${new URL(u).hostname}: ${e.message}`); }
          }
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 20m api 2>&1 | grep -iE 'auth|telegram|img' | tail -15" | sed 's/^/::warning::log /' || true
