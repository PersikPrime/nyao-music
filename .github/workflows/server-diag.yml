# Диагностика сервера: достаёт ли он до Telegram и до ретранслятора. Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          const t = Date.now();
          try {
            const r = await fetch('http://127.0.0.1:8080/wave/mix', { method: 'POST', headers: { 'content-type': 'application/json' }, signal: AbortSignal.timeout(40000),
              body: JSON.stringify({ seeds: [{ artist: 'Shaderism', title: 'Paracosm Influx' }, { artist: 'Пошлая Молли', title: 'Буду твоим пёсиком' }, { artist: 'Crystal Castles', title: 'Intimate' }], size: 12 }) });
            const j = await r.json();
            console.log(`::notice::/wave/mix: HTTP ${r.status} за ${Date.now() - t} мс, треков ${(j.tracks || []).length}`);
            for (const x of (j.tracks || []).slice(0, 8)) console.log(`::notice::  ${x.artist} — ${x.title} (${x.reason})`);
            if (j.error) console.log(`::error::${j.error}`);
          } catch (e) { console.log(`::error::/wave/mix: ${e.message}`); }
          console.log(`::notice::LASTFM_KEY: ${process.env.LASTFM_KEY ? 'есть' : 'нет'}`);
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 20m api 2>&1 | grep -iE 'wave|img' | tail -15" | sed 's/^/::warning::log /' || true
