# Диагностика сервера (сейчас — ролики полного экрана). Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          // ролики полного экрана: что лежит в базе и находит ли их плеер
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const { rows } = await pool.query('SELECT id, artist, title, track_key, title_key, mode, channels, enabled, file IS NOT NULL AS has_file, proc, size, views FROM fs_videos ORDER BY id');
          for (const r of rows) console.log(`::notice::#${r.id} «${r.artist}» — «${r.title}» key=${r.track_key} tkey=${r.title_key} ${r.mode} ch=${r.channels} on=${r.enabled} file=${r.has_file} proc=${r.proc} size=${r.size} views=${r.views}`);
          for (const r of rows) {
            const u = `http://127.0.0.1:8080/media/fsvideo?${new URLSearchParams({ artist: r.artist, title: r.title, channel: 'nightly' })}`;
            const j = await (await fetch(u)).json().catch((e) => ({ error: e.message }));
            console.log(`::notice::lookup #${r.id}: ${j.video ? 'найден #' + j.video.id + ' ' + j.video.url : JSON.stringify(j)}`);
          }
          await pool.end();
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 20m api 2>&1 | grep -iE 'fsvideo|fsv|ffmpeg|EACCES' | tail -25" | sed 's/^/::warning::log /' || true
