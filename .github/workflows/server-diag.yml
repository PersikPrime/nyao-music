# Диагностика сервера: достаёт ли он до Telegram и до ретранслятора. Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          import tls from 'node:tls';
          // как в src/index.js: без постквантового обмена ключами, его режет провайдер
          tls.DEFAULT_ECDH_CURVE = process.env.TLS_CURVES || 'X25519:prime256v1:secp384r1';
          const { TelegramOIDC } = await import(process.cwd() + '/src/telegram.js');
          const relay = process.env.TG_RELAY || '';
          const tg = new TelegramOIDC({ clientId: 'x', clientSecret: 'y', redirectUri: 'https://x/cb', relay });
          const host = relay ? new URL(relay).host : 'oauth.telegram.org напрямую';
          const t = Date.now();
          try { await tg.jwks(); console.log(`::notice::Telegram через ${host}: ок за ${Date.now() - t} мс`); }
          catch (e) { console.log(`::error::Telegram через ${host}: ${e.message}`); }
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 20m api 2>&1 | grep -iE 'auth|telegram' | tail -15" | sed 's/^/::warning::log /' || true
