# Диагностика сервера: достаёт ли он до Telegram и до ретранслятора. Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          import dns from 'node:dns/promises';
          import tls from 'node:tls';
          const tryTls = (ip, sni) => new Promise((res) => {
            const t = Date.now();
            const s = tls.connect({ host: ip, port: 443, servername: sni, timeout: 6000 }, () => { res(`ok ${Date.now() - t} мс`); s.destroy(); });
            s.on('timeout', () => { res('timeout'); s.destroy(); });
            s.on('error', (e) => res(e.code || e.message));
          });
          for (const h of ['withnyao.app', 'music.withnyao.app', 'lyrics.withnyao.app', 'bixtl.cc', 'workers.dev', 'pages.dev', 'vercel.app', 'deno.dev', 'netlify.app']) {
            const ips = await dns.resolve4(h).catch((e) => [e.code]);
            const res = [];
            for (const ip of ips.slice(0, 2)) res.push(`${ip} ${/^\d/.test(ip) ? await tryTls(ip, h) : ''}`);
            console.log(`::notice::${h}: ${res.join(' | ')}`);
          }
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 3h api 2>&1 | grep -iE 'auth|telegram' | tail -15" | sed 's/^/::warning::log /' || true
