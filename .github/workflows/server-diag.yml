# Диагностика сервера: достаёт ли он до Telegram и до ретранслятора. Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          import tls from 'node:tls';
          tls.DEFAULT_ECDH_CURVE = 'X25519:prime256v1:secp384r1';
          const urls = {
            'telegram userpic': 'https://t.me/i/userpic/320/durov.jpg',
            'telesco.pe': 'https://cdn4.telesco.pe/file/',
            'i.ytimg.com': 'https://i.ytimg.com/vi/dQw4w9WgXcQ/mqdefault.jpg',
            'lh3.googleusercontent': 'https://lh3.googleusercontent.com/a/default-user=s96',
            'i1.sndcdn.com': 'https://i1.sndcdn.com/avatars-000000000000-000000-t500x500.jpg',
            'avatars.yandex.net': 'https://avatars.yandex.net/get-music-content/',
            'sun9.userapi.com': 'https://sun9-1.userapi.com/',
            'i.scdn.co': 'https://i.scdn.co/image/ab67616d0000b273',
          };
          for (const [n, u] of Object.entries(urls)) {
            const t = Date.now();
            try { const r = await fetch(u, { signal: AbortSignal.timeout(8000), redirect: 'manual' }); console.log(`::notice::${n}: HTTP ${r.status} ${Date.now() - t} мс`); }
            catch (e) { console.log(`::error::${n}: ${e.cause?.code || e.message}`); }
          }
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 20m api 2>&1 | grep -iE 'auth|telegram' | tail -15" | sed 's/^/::warning::log /' || true
