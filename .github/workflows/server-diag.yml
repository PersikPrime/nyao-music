# Диагностика сервера: достаёт ли он до Telegram и до ретранслятора. Только чтение, ничего не меняет.
name: Server diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/nyao/server
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Проверка из контейнера
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          cat > probe.mjs <<'JS'
          const { pinnedFetch, RELAY_IPS } = await import(process.cwd() + '/src/telegram.js');
          const url = process.env.TG_RELAY.replace(/\/$/, '') + '/.well-known/jwks.json';
          for (const ip of [...RELAY_IPS, '104.16.123.96', '172.66.0.227']) {
            for (let k = 0; k < 2; k++) {
              const t = Date.now();
              try {
                const r = await pinnedFetch(url, { ip, timeout: 6000, headers: { 'user-agent': 'NyaoServer/1.0', accept: 'application/json' } });
                const body = (await r.text()).replace(/\s+/g, ' ').slice(0, 90);
                console.log(`::notice::${ip} #${k}: HTTP ${r.status} ${Date.now() - t} мс — ${body}`);
              } catch (e) { console.log(`::error::${ip} #${k}: ${e.message}`); }
            }
          }
          JS
          $SSH "cd $REMOTE_DIR && docker compose exec -T api node --input-type=module -" < probe.mjs
          $SSH "cd $REMOTE_DIR && docker compose logs --since 3h api 2>&1 | grep -iE 'auth|telegram' | tail -15" | sed 's/^/::warning::log /' || true
