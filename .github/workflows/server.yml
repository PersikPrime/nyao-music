# Деплой сервера Nyao Music на Selectel: тесты → копируем server/ по SSH → docker compose up.
# Секреты (Settings → Secrets → Actions): NYAO_SSH_HOST, NYAO_SSH_USER, NYAO_SSH_KEY,
# NYAO_TG_CLIENT_SECRET, NYAO_DB_PASSWORD, NYAO_TG_RELAY (адрес ретранслятора на Cloudflare),
# NYAO_FCM_SERVICE_ACCOUNT (JSON ключа сервисного аккаунта Firebase — для push). Токены музыкальных сервисов на сервер не попадают.
name: Server deploy

on:
  # сервер и сайты (тексты, ссылки) выкатываются сами при push в main или nightly — без сборки приложений
  # (сборки Android и ПК запускаются только от изменений в своих папках)
  push:
    branches: [main, nightly]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

env:
  DOMAIN: api.nmusic.bixtl.cc
  API_DOMAIN: api.music.withnyao.app
  WEB_DOMAIN: music.withnyao.app
  LYRICS_DOMAIN: lyrics.withnyao.app
  LYRICS_API_DOMAIN: api.corrode5-15.withnyao.app
  TG_CLIENT_ID: '8853157969'
  REMOTE_DIR: /opt/nyao/server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Тесты
        working-directory: server
        run: |
          npm ci
          npm test

      - name: SSH-ключ
        env:
          KEY: ${{ secrets.NYAO_SSH_KEY }}
          HOST: ${{ secrets.NYAO_SSH_HOST }}
        run: |
          test -n "$KEY" || { echo "::error::Нет секрета NYAO_SSH_KEY"; exit 1; }
          test -n "$HOST" || { echo "::error::Нет секрета NYAO_SSH_HOST"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Файл .env
        env:
          TG_SECRET: ${{ secrets.NYAO_TG_CLIENT_SECRET }}
          DB_PASSWORD: ${{ secrets.NYAO_DB_PASSWORD }}
          # адрес Cloudflare Worker из server/cloudflare-worker.js: в РФ ТСПУ режет серверу oauth.telegram.org
          TG_RELAY: ${{ secrets.NYAO_TG_RELAY }}
          FCM: ${{ secrets.NYAO_FCM_SERVICE_ACCOUNT }}
          KS_B64: ${{ secrets.NYAO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NYAO_KEYSTORE_PASSWORD }}
        run: |
          # отпечаток ключа подписи APK (публичный) — для Android App Links на сайте
          CERT=""
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            CERT=$(keytool -list -v -keystore "$RUNNER_TEMP/ks.jks" -storepass "$KS_PASS" 2>/dev/null | grep -m1 -i 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' \r')
            rm -f "$RUNNER_TEMP/ks.jks"
          fi
          test -n "$CERT" || echo "::warning::Не получил отпечаток ключа APK — ссылки на сайте не будут открывать приложение сразу (останется кнопка)"
          test -n "$DB_PASSWORD" || { echo "::error::Нет секрета NYAO_DB_PASSWORD"; exit 1; }
          test -n "$TG_SECRET" || echo "::warning::Нет секрета NYAO_TG_CLIENT_SECRET — вход через Telegram будет выключен"
          test -n "$FCM" || echo "::warning::Нет секрета NYAO_FCM_SERVICE_ACCOUNT — push-уведомления будут выключены"
          q() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"; }
          {
            echo "DOMAIN=$DOMAIN"
            echo "API_DOMAIN=$API_DOMAIN"
            echo "WEB_DOMAIN=$WEB_DOMAIN"
            echo "LYRICS_DOMAIN=$LYRICS_DOMAIN"
            echo "LYRICS_API_DOMAIN=$LYRICS_API_DOMAIN"
            echo "LYRICS_ADMINS=${{ vars.NYAO_LYRICS_ADMINS }}"
            echo "ANDROID_CERT_SHA256=$CERT"
            echo "TG_CLIENT_ID=$TG_CLIENT_ID"
            echo "TG_CLIENT_SECRET=$(q "$TG_SECRET")"
            echo "POSTGRES_PASSWORD=$(q "$DB_PASSWORD")"
            echo "TG_RELAY=$(q "$TG_RELAY")"
            # ключ Firebase многострочный — кладём одной строкой base64
            echo "FCM_SERVICE_ACCOUNT=$(printf '%s' "$FCM" | base64 -w0)"
            # минимальная сборка: Settings → Secrets and variables → Actions → Variables → NYAO_MIN_BUILD
            echo "MIN_BUILD=${{ vars.NYAO_MIN_BUILD || '24' }}"
          } > server/.env

      - name: Копирование и запуск
        env:
          HOST: ${{ secrets.NYAO_SSH_HOST }}
          USER_: ${{ secrets.NYAO_SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 ${USER_:-deploy}@$HOST"
          # понятная ошибка в сводке запуска, если сервер не пустил
          grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_deploy || echo "::error::NYAO_SSH_KEY не похож на приватный ключ (нужен файл nyao_deploy без .pub)"
          test -s ~/.ssh/known_hosts || echo "::error::ssh-keyscan не достучался до $HOST:22 (файрвол или другой порт SSH)"
          if ! $SSH "mkdir -p $REMOTE_DIR && command -v docker >/dev/null || echo NO_DOCKER" > ssh.out 2> ssh.err; then
            echo "::error::SSH не пустил: $(tail -n 3 ssh.err | tr '\n' ' ')"
            exit 1
          fi
          if grep -q NO_DOCKER ssh.out; then echo "::error::На сервере нет docker (или пользователь не в группе docker)"; exit 1; fi
          tar -C server --exclude=node_modules --exclude=test -czf - . | $SSH "tar -xzf - -C $REMOTE_DIR && chmod 600 $REMOTE_DIR/.env"
          $SSH "cd $REMOTE_DIR && docker compose up -d --build --remove-orphans && docker image prune -f > /dev/null && docker compose ps"

      - name: Проверка
        run: |
          for i in $(seq 1 30); do
            if out=$(curl -fsS "https://$DOMAIN/health"); then echo "$out"; exit 0; fi
            sleep 10
          done
          echo "::error::https://$DOMAIN/health не ответил за 5 минут (DNS, порты 80/443 или сертификат)"
          exit 1
      - name: Проверка новых адресов
        run: |
          # новые домены: если DNS ещё не настроен, это только предупреждение — старый адрес работает
          for d in "$API_DOMAIN" "$WEB_DOMAIN" "$LYRICS_DOMAIN" "$LYRICS_API_DOMAIN"; do
            ok=""
            for i in $(seq 1 12); do curl -fsS "https://$d/health" > /dev/null && { ok=1; break; }; sleep 10; done
            if [ -n "$ok" ]; then echo "https://$d — работает"; else echo "::warning::https://$d пока не отвечает (DNS или сертификат ещё не готовы)"; fi
          done
      - name: Проверка каталога Яндекса для сайта текстов
        run: |
          # сервер ищет треки в каталоге Яндекс Музыки без входа; если Яндекс не пускает — только предупреждение
          code=$(curl -s -o /tmp/cat.json -w '%{http_code}' "https://$LYRICS_DOMAIN/api/catalog?q=$(printf 'кино' | jq -sRr @uri)")
          if [ "$code" = "200" ] && [ "$(jq '.items | length' /tmp/cat.json)" -gt 0 ]; then
            echo "каталог работает: $(jq -r '.items[0] | "\(.artist) — \(.title)"' /tmp/cat.json)"
          else
            echo "::warning::Каталог Яндекса на сайте текстов не отвечает ($code): $(head -c 200 /tmp/cat.json)"
          fi
