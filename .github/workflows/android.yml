# Сборка Android-APK на серверах GitHub: запускается при каждом push или вручную (Actions → Android APK → Run workflow).
# Готовый APK — во вкладке Actions → нужный запуск → Artifacts, качается прямо на телефон.
name: Android APK

on:
  push:
    paths: ['android/**', 'version.json', '.github/workflows/android.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Android SDK уже стоит на раннерах GitHub — доставляем нужную платформу
      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # Постоянный ключ подписи из секретов: тогда обновления ставятся поверх, без переустановки
      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.NYAO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nyao.jks"
            echo "NYAO_KEYSTORE=$RUNNER_TEMP/nyao.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета NYAO_KEYSTORE_B64 — APK подпишется случайным debug-ключом и не встанет поверх старой версии"
          fi
      - name: Сборка
        working-directory: android
        env:
          NYAO_KEYSTORE_PASSWORD: ${{ secrets.NYAO_KEYSTORE_PASSWORD }}
          NYAO_KEY_ALIAS: nyao
          NYAO_LASTFM_KEY: ${{ secrets.NYAO_LASTFM_KEY }}
          NYAO_LASTFM_SECRET: ${{ secrets.NYAO_LASTFM_SECRET }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # ошибки компиляции — в аннотации запуска, чтобы их было видно без скачивания лога
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | head -20 | sed 's/^/::error::/'; exit 1; }
          # проверка: каким сертификатом подписан APK (отпечаток SHA-256 должен быть одинаковым у всех сборок)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256" | head -1
      - name: Имя файла с версией
        id: ver
        run: |
          N=$(jq -r '.name' version.json); B=$(jq -r '.build' version.json)
          echo "name=NyaoMusic-$N-$B" >> "$GITHUB_OUTPUT"
          echo "tag=v$N.$B" >> "$GITHUB_OUTPUT"
          echo "title=Nyao Music $N ($B)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/apk/release/app-release.apk

      # Релиз с APK: тег v0.2.17 и т. д. Если в релизе уже есть APK этой сборки — он заменяется
      - name: Релиз
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.ver.outputs.name }}.apk"
          .github/scripts/release-upload.sh "${{ steps.ver.outputs.name }}.apk"
