# Сборка Android-APK на серверах GitHub: запускается при каждом push или вручную (Actions → Android APK → Run workflow).
# Готовый APK — во вкладке Actions → нужный запуск → Artifacts, качается прямо на телефон.
name: Android APK

on:
  push:
    paths: ['android/**', 'version.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Android SDK уже стоит на раннерах GitHub — доставляем нужную платформу
      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Сборка
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Имя файла с версией
        id: ver
        run: echo "name=NyaoMusic-$(jq -r '.name' version.json)-$(jq -r '.build' version.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/apk/release/app-release.apk
