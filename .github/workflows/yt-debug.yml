name: YT debug
on:
  push:
    branches: [yt-debug]
jobs:
  yt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - shell: bash
        run: |
          node scripts/yt-debug.mjs > yt.log 2>&1 || true
          cat yt.log
          grep -E "^(OK|ERR)|    at |   -" yt.log | head -60 | while IFS= read -r line; do echo "::notice::${line}"; done
