[package]
name = "nyao-librespot"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
default = ["audio"]
audio = ["librespot/rodio-backend"]

[dependencies]
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync"] }

[profile.release]
strip = true
lto = "thin"
