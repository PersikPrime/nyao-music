# Сервер Nyao Music: API + Postgres + Caddy (HTTPS). Переменные — в .env рядом (его пишет деплой).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nyao
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # пароль отдельно: спецсимволы в пароле сломали бы URL
      DATABASE_URL: postgres://nyao@db:5432/nyao
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_URL: https://${DOMAIN}
      TG_CLIENT_ID: ${TG_CLIENT_ID}
      TG_CLIENT_SECRET: ${TG_CLIENT_SECRET}
      TG_RELAY: ${TG_RELAY:-}
      MIN_BUILD: ${MIN_BUILD:-0}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      WEB_URL: https://${WEB_DOMAIN:-music.withnyao.app}
      WEB_HOSTS: ${WEB_DOMAIN:-music.withnyao.app}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      LYRICS_HOSTS: ${LYRICS_DOMAIN:-lyrics.withnyao.app}
      LYRICS_API_HOSTS: ${LYRICS_API_DOMAIN:-api.corrode5-15.withnyao.app}
      LYRICS_ADMINS: ${LYRICS_ADMINS:-}
      DEV_IDS: ${DEV_IDS:-}
      MIRROR_DIR: /data/releases
      STATUS_FILE: /data/status/status.json
      # Nyao Automator: роли админов и токен GitHub (только на сервере)
      ADMIN_IDS: ${ADMIN_IDS:-}
      GH_ADMIN_TOKEN: ${GH_ADMIN_TOKEN:-}
      AUTOMATOR_REPO: ${AUTOMATOR_REPO:-PersikPrime/automator}
      DATA_DIR: /data
    volumes:
      - releases:/data/releases
      - status:/data/status

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN:-api.music.withnyao.app}
      WEB_DOMAIN: ${WEB_DOMAIN:-music.withnyao.app}
      LYRICS_DOMAIN: ${LYRICS_DOMAIN:-lyrics.withnyao.app}
      LYRICS_API_DOMAIN: ${LYRICS_API_DOMAIN:-api.corrode5-15.withnyao.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  releases:
  status:
  caddy_data:
  caddy_config:
